<!doctype html>
<!--
  Branded download link for the website's button:
    https://updates.trendywestend.com/the-splitter/download/
  GitHub Pages can't redirect on the server, so the browser is sent on to
  GitHub's "latest release" URL, which always resolves to the newest
  The-Splitter.dmg. The appcast doesn't use this page; Sparkle reads
  appcast.xml directly.
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <meta http-equiv="refresh" content="0; url=https://github.com/snichol67/the-splitter-updates/releases/latest/download/The-Splitter.dmg">
  <title>Downloading The Splitter</title>
  <style>
    :root {
      --bg: #ffffff;
      --text: #1d1d1f;
      --muted: #6e6e73;
      --link: #0066cc;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #1d1d1f;
        --text: #f5f5f7;
        --muted: #a1a1a6;
        --link: #4da3ff;
      }
    }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0 16px;
      background: var(--bg);
      color: var(--text);
      font: 17px/1.5 -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif;
      text-align: center;
    }
    main { max-width: 32rem; }
    h1 { font-size: 1.5rem; margin: 0 0 0.5rem; }
    p { margin: 0.5rem 0; color: var(--muted); }
    a { color: var(--link); }
  </style>
</head>
<body>
  <main>
    <h1>Your download should begin momentarily</h1>
    <p>The Splitter is downloading. Open the disk image and drag The Splitter to your Applications folder.</p>
    <p>If it doesn't start, <a href="https://github.com/snichol67/the-splitter-updates/releases/latest/download/The-Splitter.dmg">download The Splitter directly</a>.</p>
    <p>Requires Apple Silicon and macOS 26.5 or later.</p>
    <p><a href="https://trendywestend.com/the-splitter/">Back to The Splitter</a></p>
  </main>
  <script>
    // Belt and braces alongside the meta refresh, which some browsers delay.
    location.replace("https://github.com/snichol67/the-splitter-updates/releases/latest/download/The-Splitter.dmg");
  </script>
</body>
</html>
